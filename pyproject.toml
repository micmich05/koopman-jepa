[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koopman-jepa"
version = "0.1.0"
description = "Controlled experiments on JEPA representations and Koopman dynamics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.30",
  "nbconvert>=7.16",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
koopman-jepa-phase0 = "koopman_jepa.phase0:main"

[tool.hatch.build.targets.wheel]
packages = ["src/koopman_jepa"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
