data:
  master_length: 1024
  context_length: 768
  shift: 256
  train_per_regime: 32
  val_per_regime: 8
  test_per_regime: 8
  base_seed: 0
  normalization: per_sequence

model:
  latent_dim: 32
  input_length: 768
  encoder_projection: direct
  predictor_kind: linear
  linear_initialization: identity
  mlp_depth: two_hidden
  ema_decay: 0.996

train:
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0
  batch_size: 64
  epochs: 10
  seed: 5
  device: cpu
  num_workers: 0

checkpoint_gate:
  final_window: 2
  max_validation_loss_ratio: 0.50
  max_validation_train_loss_ratio: 4.0
  min_validation_embedding_std_ratio: 0.10
  min_validation_effective_rank: 4.0

sweep:
  seeds: [5, 6, 7, 8, 9]

stability_gate:
  max_worst_validation_loss_ratio: 0.50
  max_worst_validation_train_loss_ratio: 4.0
  max_validation_loss_ratio_coefficient_of_variation: 0.25
  min_worst_validation_embedding_std_ratio: 0.10
  min_worst_validation_effective_rank: 4.0
