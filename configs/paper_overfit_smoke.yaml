data:
  master_length: 1024
  context_length: 768
  shift: 256
  train_per_regime: 1
  val_per_regime: 1
  test_per_regime: 1
  base_seed: 0
  normalization: per_sequence

model:
  latent_dim: 32
  input_length: 768
  encoder_projection: direct
  predictor_kind: linear
  linear_initialization: identity
  mlp_depth: two_hidden
  ema_decay: 0.996

optimization:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 18
  steps: 100
  seed: 0
  device: cpu

gate:
  comparison_window: 10
  max_loss_ratio: 0.25
  min_embedding_std_ratio: 0.10
  min_effective_rank: 2.0
