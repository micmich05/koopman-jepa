experiment: koopman_decay_baselines
status: frozen_before_implementation
rho_values: [0.0, 0.25, 0.5, 0.75, 1.0]
seeds: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110]

emission:
  num_phases: 4
  window_length: 128
  noise_std: 0.08
  amplitude_low: 0.8
  amplitude_high: 1.2
  offset_std: 0.15
  max_shift: 4
  pulse_width: 0.055
  secondary_offset: 0.1875
  secondary_strength: 0.45

splits:
  train_repeats_per_transition: 64
  validation_repeats_per_transition: 16
  heldout_repeats_per_transition: 16
  train_seed_offset: 11
  validation_seed_offset: 23
  heldout_seed_offset: 37
  heldout_access: after_methods_tests_and_config_are_frozen

methods:
  - phase_oracle_ols
  - raw_window_dmd
  - pca3_dmd
  - random_cnn3_dmd
  - supervised_phase_cnn3_dmd
  - jepa_learned_predictor
  - jepa_posthoc_dmd
primary_baseline: random_cnn3_dmd
target_method: jepa_learned_predictor

feature_operator:
  center_from_train: true
  ridge_objective: mean_squared_prediction_error_plus_lambda_frobenius_squared
  ridge_lambdas: [0.0, 0.000001, 0.0001, 0.01, 1.0]
  selection_split: validation
  selection_metric: feature_prediction_mse
  tie_break: smallest_lambda
  labels_used_for_selection: false

pca:
  n_components: 3
  whiten: false
  fit_samples: train_current_and_future

cnn:
  latent_dim: 3
  channels: [16, 32]
  pooling: flatten
  random_shares_jepa_initialization: true

supervised_encoder:
  num_classes: 4
  epochs: 60
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  checkpoint: final_epoch
  train_once_per_seed: true

jepa:
  epochs: 60
  batch_size: 128
  learning_rate: 0.001
  predictor_learning_rate_multiplier: 4.0
  freeze_encoder_after_epoch: 3
  weight_decay: 0.0001
  ema_momentum: 0.90
  mean_weight: 1.0
  variance_weight: 5.0
  covariance_weight: 1.0
  checkpoint: final_epoch
  device: cpu
  num_workers: 0

evaluation:
  primary_metric: per_seed_spectral_calibration_mae_across_rhos
  primary_comparison: random_cnn3_dmd_minus_jepa_learned_predictor
  paired_test: exact_one_sided_sign_flip_test_on_mean
  sign_flip_assignments: 1024
  active_rank_required_for_spectrum: 3
  rollout_horizons: [1, 2, 4, 8]
  labels_used_only_for_final_metrics: true
  report_discrete_grid_identification_as_secondary: true

