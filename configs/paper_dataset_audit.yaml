data:
  master_length: 1024
  context_length: 768
  shift: 256
  train_per_regime: 8
  val_per_regime: 2
  test_per_regime: 2
  base_seed: 0
  normalization: per_sequence

generator_assumptions:
  phase_distribution: normal
  phase_standard_deviation: pi
  wrap_phase: false
  deterministic_observation_noise_std: 0.0
  trend_time_axis: linspace_0_1_inclusive
  trend_slope_distribution: base_plus_normal_0_1
  trend_intercept_distribution: normal_0_pi_squared
  square_implementation: scipy_square_zero_phase
  square_zero_crossing_value: 1.0
  sawtooth_implementation: scipy_sawtooth_rising
  sawtooth_phase_distribution: uniform_0_2pi
  pulse_count: 5
  pulse_width: round_master_length_div_50
  pulse_shape: positive_rectangle
  pulse_start_sampling: uniform_without_replacement
  pulse_overlap: allowed
  arma_innovation_distribution: standard_normal
  arma_innovation_scale: 1.0
  arma_burnin: 0
  arma_initial_state: scipy_lfilter_zero_state
  arma_ar_polynomial_convention: one_then_negative_coefficients
  arma_ma_polynomial_convention: one_then_positive_coefficients
  high_noise_process: independent_gaussian
  high_noise_standard_deviation: 3.0
