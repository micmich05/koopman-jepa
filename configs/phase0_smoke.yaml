data:
  context_length: 128
  shift: 32
  train_per_regime: 600
  val_per_regime: 120
  test_per_regime: 120
  noise_std: 0.03
  standardize: true

model:
  latent_dim: 8
  channels: [16, 32, 64]
  predictor_init: identity

train:
  seed: 0
  epochs: 30
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  ema_momentum: 0.99
  variance_weight: 0.0
  covariance_weight: 0.0
  device: auto
  num_workers: 0

output_dir: runs/phase0
